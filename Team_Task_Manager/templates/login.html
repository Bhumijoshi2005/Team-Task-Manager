{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="d-flex align-items-center justify-content-center" style="min-height: 90vh;">

    <div class="col-md-6 col-lg-4">

        <div class="card shadow-lg border-0 p-4">

            <!-- 🔹 Header -->
            <div class="text-center mb-3">
                <h3 class="fw-bold">
                    <i class="bi bi-shield-lock me-2"></i>
                    {{ login_type }} Login
                </h3>
            </div>

            <!-- 🔹 Body -->
            <form method="POST"
                  action="{{ url_for('auth.admin_login') if login_type == 'Admin' else url_for('auth.user_login') }}">

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email"
                           name="email"
                           class="form-control form-control-lg"
                           placeholder="Enter your email"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control form-control-lg"
                           placeholder="Enter your password"
                           required>
                </div>

                <!-- Button -->
                <button type="submit"
                        class="btn btn-primary w-100 rounded-pill py-2 fs-5">
                    Login
                </button>

            </form>

            <!-- Footer -->
            <p class="text-muted text-center mt-3 mb-0">
                {% if login_type == "Admin" %}
                    🔒 Admin access only
                {% else %}
                    👤 User access
                {% endif %}
            </p>

        </div>

    </div>

</div>

{% endblock %}
