{% extends "base.html" %}

{% block title %}Project{% endblock %}

{% block content %}

<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="col-md-7 col-lg-6">

        <div class="card shadow-lg border-0 p-4" style="position: relative; z-index: 10;">

            <!-- 🔹 Header -->
            <div class="text-center mb-3">
                <h4 class="fw-bold">
                    <i class="bi bi-folder2-open me-2"></i>
                    {{ "Edit Project" if project else "Create Project" }}
                </h4>
            </div>

            <!-- 🔹 Form -->
            <form method="POST">

                <!-- Project Name -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Project Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter project name"
                           value="{{ project.name if project else '' }}"
                           required>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea name="description"
                              class="form-control"
                              rows="4"
                              placeholder="Enter project description"
                              required>{{ project.description if project else '' }}</textarea>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between mt-3">
                    <a href="{{ url_for('web.projects') }}"
                       class="btn btn-outline-secondary rounded-pill px-4">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary rounded-pill px-4">
                        Save
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}
